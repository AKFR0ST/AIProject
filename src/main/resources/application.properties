spring.application.name=sb1
server.port=8088

gigachat.base.url=https://gigachat.devices.sberbank.ru/api/v1/chat/completions
gigachat.files.url=https://gigachat.devices.sberbank.ru/api/v1/files
gigachat.auth.url=https://ngw.devices.sberbank.ru:9443/api/v2/oauth
local.base.url=http://127.0.0.1:1234/api/v1/chat
local.llm.default=GPT_OSS20B

hh.search.delay=600000
hh.search.area=1
hh.search.per-page=2

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.admin.auto-create=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=vacancy-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.datasource.url=jdbc:postgresql://localhost:5432/hhdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.show-sql=true
spring.liquibase.clear-checksums=true

