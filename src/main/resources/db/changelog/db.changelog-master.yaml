databaseChangeLog:
  - changeSet:
      id: create-vacancies-table
      author: frost
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            schemaName: public
            tableName: vacancies
      changes:
        - createTable:
            tableName: vacancies
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: hh_id
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(255)
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: employer
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: url
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: contact_name
                  type: VARCHAR(255)
              - column:
                  name: salary_from
                  type: INTEGER
              - column:
                  name: salary_to
                  type: INTEGER
              - column:
                  name: published_at
                  type: VARCHAR(255)
              - column:
                  name: cover_letter
                  type: TEXT
  - changeSet:
      id: create-resumes-table
      author: frost
      changes:
        - createTable:
            tableName: resumes
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: phone
                  type: varchar(20)
              - column:
                  name: city
                  type: varchar(255)
              - column:
                  name: profession
                  type: varchar(1000)
              - column:
                  name: skills
                  type: TEXT
              - column:
                  name: experience
                  type: TEXT
              - column:
                  name: education
                  type: TEXT
              - column:
                  name: languages
                  type: TEXT
              - column:
                  name: attachment
                  type: BYTEA
              - column:
                  name: attachment_name
                  type: varchar(255)